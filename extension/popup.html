<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        margin: 0;
        width: 320px;
        font-family: system-ui, sans-serif;
        background: #07080f;
        color: #f4f1ea;
      }
      .wrap { padding: 16px; }
      .brand { letter-spacing: 0.2em; color: #e8c36a; font-size: 12px; font-weight: 700; }
      textarea {
        width: 100%;
        box-sizing: border-box;
        min-height: 90px;
        margin-top: 10px;
        border-radius: 12px;
        border: 1px solid #ffffff22;
        background: #10121c;
        color: inherit;
        padding: 10px;
      }
      select, button {
        width: 100%;
        margin-top: 8px;
        border-radius: 999px;
        padding: 10px;
        border: 0;
      }
      button { background: #e8c36a; font-weight: 700; cursor: pointer; }
      .modes { display: flex; gap: 8px; margin-top: 8px; }
      .modes .mode { margin-top: 0; background: #10121c; border: 1px solid #ffffff22; color: #f4f1ea; }
      .modes       .mode.active { background: #5eead4; color: #062e26; }
      .status { font-size: 11px; color: #5eead4; margin-top: 10px; }
      .hint { font-size: 11px; color: #c8c3b4; margin-top: 6px; }
      .history-wrap { margin-top: 14px; border-top: 1px solid #ffffff15; pt: 10px; padding-top: 10px; }
      .history-title { font-size: 11px; font-weight: 700; color: #e8c36a; text-transform: uppercase; letter-spacing: 0.05em; display: flex; justify-content: space-between; align-items: center; }
      .history-card { background: #10121c; border: 1px solid #ffffff15; border-radius: 10px; padding: 8px; margin-top: 8px; font-size: 11px; }
      .history-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
      .badge { background: #e8c36a22; color: #e8c36a; padding: 2px 6px; border-radius: 99px; font-size: 10px; font-weight: 600; }
      .badge-label { color: #c8c3b4; font-size: 10px; }
      .history-prompt { color: #f4f1ea; font-style: italic; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 6px; line-height: 1.3; }
      .history-stats { display: flex; gap: 8px; color: #c8c3b4; font-size: 10px; }
      .replay-btn { width: auto; margin-top: 0; padding: 3px 8px; font-size: 10px; background: #5eead4; color: #062e26; border-radius: 99px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="brand">ORION</div>
      <select id="goal">
        <option value="placements">Placements</option>
        <option value="exams">Competitive Exams</option>
        <option value="skills">Skill Learning</option>
      </select>
      <textarea id="prompt">Show DSA and interview prep. Hide memes and celebrity posts.</textarea>
      <div class="modes" id="modes">
        <button type="button" class="mode" data-mode="dim">Dim</button>
        <button type="button" class="mode" data-mode="collapse">Collapse</button>
      </div>
      <button id="save">Apply intent</button>

      <div class="history-wrap">
        <div class="history-title">
          <span>Prompt History</span>
          <span id="history-count" style="font-size: 10px; color: #c8c3b4;">(0)</span>
        </div>
        <div id="history-list" style="max-height: 180px; overflow-y: auto;">
          <div style="font-size: 11px; color: #c8c3b4; margin-top: 6px;">Loading history…</div>
        </div>
      </div>

      <div class="status" id="status">Checking active tab…</div>
      <div class="hint">Scores live X (Twitter) tweets and demo posts against the FastAPI engine.</div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
